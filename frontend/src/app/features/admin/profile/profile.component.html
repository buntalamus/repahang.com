@if (loading) {
  <app-loading message="Memuatkan profil..." />
} @else {
  <div class="max-w-4xl space-y-6">
    <!-- Profile Header -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <div class="flex flex-col sm:flex-row items-center gap-6">
        <!-- Profile Image -->
        <div class="relative">
          <div class="w-24 h-24 rounded-full bg-slate-200 overflow-hidden">
            @if (profileImageUrl) {
              <img [src]="profileImageUrl" alt="Profil" class="w-full h-full object-cover" />
            } @else {
              <div class="w-full h-full flex items-center justify-center text-3xl text-slate-600">
                <span class="material-icons text-4xl">person</span>
              </div>
            }
          </div>
          <label aria-label="Ubah gambar profil" class="absolute -bottom-1 -right-1 bg-pahang-yellow rounded-full p-1.5 cursor-pointer shadow hover:brightness-95">
            <span class="material-icons text-sm text-black">edit</span>
            <input type="file" accept="image/*" class="hidden" (change)="onImageSelected($event)" />
          </label>
        </div>
        <div class="text-center sm:text-left">
          <h2 class="text-xl font-bold text-slate-900">{{ profile.nama_penuh }}</h2>
          <p class="text-sm text-slate-500">{{ profile.email }}</p>
          <p class="text-xs text-slate-600 mt-1">{{ auth.currentUser?.role }}</p>
        </div>
        <div class="sm:ml-auto">
          @if (!editing) {
            <button (click)="toggleEdit()"
              class="px-4 py-2 text-sm bg-pahang-black text-pahang-yellow font-semibold rounded-lg hover:bg-gray-800 transition">
              Edit Profil
            </button>
          } @else {
            <div class="flex gap-2">
              <button (click)="toggleEdit()"
                class="px-4 py-2 text-sm border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50">Batal</button>
              <button (click)="saveProfile()" [disabled]="saving"
                class="px-4 py-2 text-sm bg-pahang-black text-pahang-yellow font-semibold rounded-lg hover:bg-gray-800 disabled:opacity-60">
                {{ saving ? 'Menyimpan...' : 'Simpan' }}
              </button>
            </div>
          }
        </div>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <app-profile-fields [record]="editing ? draft : profile" [editing]="editing" [adminMode]="auth.currentUser?.role === 'Admin'" [memberRole]="auth.currentUser?.role || 'Pengadil'" [associations]="associations" />
    </div>
    <app-telegram-profile [linked]="profile.telegram_linked ?? null" />

    <app-web-push-card />

    <!-- Change Password -->
    <app-change-password />

    <!-- Image Crop Modal -->
    <app-image-crop #imageCrop (cropped)="onImageCropped($event)" />
  </div>
}
