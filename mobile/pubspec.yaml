name: refpahang
description: "RefPahang mobile app: lantikan, permohonan, sejarah dan notifikasi."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.2.0
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # Inter, the website's font (SIL Open Font License).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-300.ttf
          weight: 300
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800

# App icon: the PBNP logo used by the website. Regenerate with
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo-pahang.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo-pahang.png
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 21
