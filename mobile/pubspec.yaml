name: refpahang
description: "RefPahang mobile app: lantikan, permohonan, sejarah dan notifikasi."
publish_to: 'none'
version: 1.4.0+8

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  file_picker: ^13.3.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_secure_storage: ^11.2.0
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  restart_app: ^1.10.2
  shorebird_code_push: ^2.0.7
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - shorebird.yaml
  # Inter, the website's font (SIL Open Font License).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-300.ttf
          weight: 300
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800

# App icon: the PBNP logo used by the website. Regenerate with
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo-pahang.png
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: assets/images/logo-pahang.png
  adaptive_icon_foreground_inset: 17
  min_sdk_android: 21
